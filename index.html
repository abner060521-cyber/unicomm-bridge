:root{--font-sans:'DM Sans','Microsoft YaHei',system-ui,sans-serif;--font-heading:'Bricolage Grotesque','Microsoft YaHei',system-ui,sans-serif;--font-mono:'DM Mono',monospace;--background:#fffaf3;--foreground:#2a1a12;--muted-foreground:#6f5d50;--primary:#c9381e;--secondary:#2f7a4f;--border:#e9dfd4;--card:#fff;--radius:20px;font-family:var(--font-sans);color:var(--foreground);background:var(--background);font-synthesis:none}

.pantry-market{max-width:520px;min-height:100dvh;margin:0 auto;padding:12px 16px 32px}

.pantry-market .brand-options button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:white}

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    const rate=s.opens?100*s.claims/s.opens:0;
    document.querySelector('#rate').textContent=rate.toFixed(1);document.querySelector('#opens').textContent=s.opens;document.querySelector('#claims').textContent=s.claims;
    document.querySelector('#last-update').textContent=`Updated ${new Date().toLocaleTimeString('en-GB',{hour12:false})}`;
    document.querySelector('#rankings').innerHTML=[...coupons].sort((a,b)=>(s.coupons[b.id]||0)-(s.coupons[a.id]||0)).map(c=>`<div class="rank"><span>${c.brand.name} · ${c.name}</span><b>${s.coupons[c.id]||0}</b></div>`).join('');
    if(config.mode==='demo')document.querySelector('#connection').textContent='Local demo · Not cross-device live data';
    else document.querySelector('#connection').textContent=s.active===false?'This round has ended':connectionState;
  }
  stopWatch=watchStats(s=>{if(!demoPlaying)paint(s);},message=>{connectionState=message;if(!demoPlaying)document.querySelector('#connection').textContent=message;});
  document.querySelector('#animate-demo')?.addEventListener('click',event=>{
    if(demoPlaying){clearInterval(demoTimer);demoPlaying=false;event.target.textContent='Play sample data';return;}
    demoPlaying=true;event.target.textContent='Restore local counts';let step=0;
    function next(){step=Math.min(step+1,38);const claims=Math.floor(step*.63);const counts={};for(let i=0;i<claims;i++){const id=coupons[i%coupons.length].id;counts[id]=(counts[id]||0)+1;}paint({opens:step,claims,coupons:counts});document.querySelector('#connection').textContent='Sample animation · Not real participation data';if(step===38)clearInterval(demoTimer);}
    next();demoTimer=setInterval(next,650);
  });
}
function render(){clearInterval(demoTimer);demoPlaying=false;stopWatch?.();if(screenMode){showScreen();return;}const parts=location.hash.replace(/^#\//,'').split('/');if(parts[0]==='error'||parts[0]==='reveal')claimError();else if(parts[0]==='coupon')detail(findCoupon(parts[1]));else market();window.scrollTo(0,parts[0]==='coupon'||parts[0]==='error'||parts[0]==='reveal'?0:marketScroll);}
app.addEventListener('click',e=>{const confirmed=e.target.closest('[data-confirm-claim]');if(confirmed){e.preventDefault();claim(confirmed.dataset.confirmClaim);return;}if(e.target.closest('[data-cancel-claim]')){const dialog=document.querySelector('.claim-dialog');const phone=dialog?.querySelector('#claim-phone');if(phone)phone.value='';dialog?.close();return;}if(e.target.closest('.coupon-open')){marketScroll=window.scrollY;brandScroll=document.querySelector('.brand-options')?.scrollLeft||0;}const claimButton=e.target.closest('[data-claim]');if(claimButton){e.preventDefault();requestClaim(claimButton.dataset.claim);return;}const button=e.target.closest('[data-filter]');if(button){brandScroll=document.querySelector('.brand-options').scrollLeft;filter=button.dataset.filter;marketScroll=0;render();const active=[...document.querySelectorAll('[data-filter]')].find(b=>b.dataset.filter===filter);active?.focus({preventScroll:true});return;}if(e.target.closest('#back-market'))location.hash='#/';});
window.addEventListener('hashchange',render);
window.addEventListener('pagehide',()=>{const phone=document.querySelector('#claim-phone');if(phone)phone.value='';});
if(!screenMode)recordOpen();
render();
if(screenMode&&(!configured()||!storageAvailable)){const note=document.createElement('p');note.className='config-notice';note.textContent=!configured()?'Live counting is not configured. Counts will not be uploaded.':'Browser storage is unavailable. Refreshing may duplicate counts.';app.prepend(note);}

</script></body></html>
